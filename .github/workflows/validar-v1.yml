name: Validar propuesta V1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar JSON
        run: python -m json.tool config/conexiones.example.json > /dev/null
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Compilar auditor
        run: python -m py_compile scripts/auditar_fuentes.py

