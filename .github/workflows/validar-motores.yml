name: Validar motores

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias Python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Compilar motor Python
        run: python -m py_compile scripts/*.py
      - name: Probar motor JavaScript
        run: node --test tests/*.test.mjs
      - name: Validar exportación Max & Min
        run: |
          node tests/generar_exportacion_max_min.mjs /tmp/max_min_validacion.xlsx
          python scripts/validar_exportacion_max_min.py /tmp/max_min_validacion.xlsx
      - name: Validar interfaz pública
        run: |
          node --check assets/app.js
          node --check assets/engine.mjs
          node --check assets/export.mjs
          node --check assets/operations.mjs
          node --check assets/ui.mjs
      - name: Impedir bases operativas
        run: |
          if git ls-files | grep -Ei '\.(xls|xlsx|xlsm|xlsb|csv|tsv)$'; then
            echo "No se permiten archivos base u operativos en el repositorio."
            exit 1
          fi
          if grep -nEi 'Exportar diagnóstico|demoButton|archivo_patron' index.html assets/app.js assets/engine.mjs assets/export.mjs; then
            echo "Se detectó lógica obsoleta."
            exit 1
          fi
